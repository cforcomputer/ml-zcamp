<!DOCTYPE html>
<html>
<head>
  <title>Camp Training Data</title>
  <style>
    body {
      background: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    .camp-list {
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .camp-card {
      border: 1px solid #333;
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
    }
    .camp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .kill-list {
      margin: 10px 0;
      max-height: 200px;
      overflow-y: auto;
    }
    .kill-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .kill-link {
      color: #66b3ff;
      text-decoration: none;
    }
    .kill-link:hover {
      text-decoration: underline;
    }
    .categorization {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .button {
      padding: 8px 20px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .button:hover {
      opacity: 0.8;
    }
    .yes-button {
      background: #44ff44;
      color: black;
    }
    .no-button {
      background: #ff4444;
      color: white;
    }
    .killmail-entry {
      border: 1px solid #333;
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div id="killmail-list" class="killmail-list"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      async function loadUnlabeledKillmails() {
        try {
          const killmails = await window.electronAPI.getUnlabeledKillmails();
          renderKillmails(killmails);
        } catch (error) {
          console.error("Error loading unlabeled killmails:", error);
        }
      }

      function renderKillmails(killmails) {
        const container = document.getElementById('killmail-list');
        container.innerHTML = '';

        killmails.forEach(killmailData => {
          if (!killmailData.is_at_stargate) return;

          const killmail = JSON.parse(killmailData.zkill_data);
          const killmailEl = document.createElement('div');
          killmailEl.className = 'killmail-entry';
          killmailEl.innerHTML = `
            <div class="killmail-header">
              <a href="https://zkillboard.com/kill/${killmail.killID}/" target="_blank">
                Killmail #${killmail.killID}
              </a>
              <span> - ${formatTime(killmail.killmail.killmail_time)}</span>
            </div>
            <div class="killmail-details">
              System: ${killmail.killmail.solar_system_id}
              ${killmail.pinpoints?.nearestCelestial?.name ? 
                `<br>Nearest Celestial: ${killmail.pinpoints.nearestCelestial.name}` : ''}
            </div>
            <div class="categorization">
              <button class="button yes-button" data-killmail-id="${killmail.killID}">
                Real Camp
              </button>
              <button class="button no-button" data-killmail-id="${killmail.killID}">
                Not a Camp
              </button>
            </div>
          `;

          const yesButton = killmailEl.querySelector('.yes-button');
          yesButton.addEventListener('click', async () => {
            await window.electronAPI.labelKillmail(killmail.killID, true);
            killmailEl.remove();
          });

          const noButton = killmailEl.querySelector('.no-button');
          noButton.addEventListener('click', async () => {
            await window.electronAPI.labelKillmail(killmail.killID, false);
            killmailEl.remove();
          });

          container.appendChild(killmailEl);
        });
      }

      function formatTime(timestamp) {
        return new Date(timestamp).toLocaleString();
      }

      loadUnlabeledKillmails();

      window.electronAPI.onNewKillmail(async (killmail) => {
        await loadUnlabeledKillmails();
      });
    });
  </script>
</body>
</html>
